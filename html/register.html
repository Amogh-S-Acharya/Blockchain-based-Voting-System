<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voter Registration</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- face-api.js library -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    .face-capture-container {
      margin: 20px 0;
      padding: 15px;
      border: 2px solid #0b3d91;
      border-radius: 8px;
      background: #f5f7fa;
    }
    #videoElement {
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      margin: 10px 0;
    }
    #canvasElement {
      display: none;
    }
    .face-status {
      margin: 10px 0;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.9em;
    }
    .face-status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .face-status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .face-status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    #captureFaceBtn {
      background: #0b3d91;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px 0;
    }
    #captureFaceBtn:hover {
      background: #0a2f6b;
    }
    #captureFaceBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Create Your Account 📝</h2>

    <div class="role-display" style="text-align: center; margin: 15px 0; padding: 15px; background: #e6eef9; border-radius: 8px; border: 1px solid #c3c9d5;">
      <strong style="color: #0b3d91">Currently Logging in as: Voter</strong><br />
      <small style="color: #666">
        Not correct?
        <a href="role-selection.html" style="color: #0b3d91; font-weight: 600">Change Role</a>
      </small>
    </div>

    <form id="registerForm">
      <input type="text" name="fullName" placeholder="Full Name" required>
      <input type="text" id="dob" name="dateOfBirth" placeholder="Date of Birth" 
             onfocus="(this.type='date')" 
             onblur="if(!this.value)this.type='text'" required>
      <input type="tel" name="mobileNumber" placeholder="Mobile Number" required>
      <input type="text" name="aadhaarNumber" placeholder="Aadhaar Number" required>
      <input type="text" name="email" placeholder="Email" required>

      <!-- Face Capture Section -->
      <div class="face-capture-container">
        <h3 style="margin-top: 0; color: #0b3d91;">📸 Face Registration</h3>
        <p style="font-size: 0.9em; color: #666; margin: 5px 0;">Please allow camera access and position your face clearly in the frame</p>
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="canvasElement"></canvas>
        <div id="faceStatus" class="face-status info">Initializing camera...</div>
        <button type="button" id="captureFaceBtn" disabled>Capture Face</button>
      </div>

      <button type="button" id="connectWallet">Connect MetaMask</button>
      <div id="walletStatus" style="margin: 10px 0; padding: 10px; border-radius: 6px; display: none;">
        <small id="walletAddress"></small>
      </div>

      <button type="submit" id="registerBtn" disabled>Register</button>
    </form>

    <p>Already registered? <a href="login.html">Login here</a></p>
  </div>

  <script type="module">
  let userWallet = null;
  // store multiple descriptors captured during registration (array of Float32 arrays as plain JS arrays)
  let faceDescriptors = [];
    let modelsLoaded = false;
    let videoStream = null;

    window.addEventListener("DOMContentLoaded", async () => {
      const form = document.getElementById("registerForm");
      const connectWalletBtn = document.getElementById("connectWallet");
      const walletStatus = document.getElementById("walletStatus");
      const walletAddressEl = document.getElementById("walletAddress");
      const videoElement = document.getElementById("videoElement");
      const canvasElement = document.getElementById("canvasElement");
      const captureFaceBtn = document.getElementById("captureFaceBtn");
      const faceStatus = document.getElementById("faceStatus");

      // Initialize face-api.js models
      async function loadFaceModels() {
        try {
          faceStatus.textContent = "Loading face recognition models...";
          faceStatus.className = "face-status info";
          
          // Load models from local /weights folder (hosted locally to avoid CORS issues)
          await Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri('/weights'),
            faceapi.nets.faceLandmark68Net.loadFromUri('/weights'),
            faceapi.nets.faceRecognitionNet.loadFromUri('/weights')
          ]);
          
          modelsLoaded = true;
          faceStatus.textContent = "Models loaded! Starting camera...";
          faceStatus.className = "face-status success";
          
          // Start camera
          await startCamera();
        } catch (error) {
          console.error("Error loading face models:", error);
          faceStatus.textContent = "Error loading face recognition. Please refresh the page.";
          faceStatus.className = "face-status error";
        }
      }

      // Start camera
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
              width: 640, 
              height: 480,
              facingMode: 'user' 
            } 
          });
          videoStream = stream;
          videoElement.srcObject = stream;
          
          faceStatus.textContent = "Camera started! Position your face in the frame.";
          faceStatus.className = "face-status info";
          captureFaceBtn.disabled = false;
          
          // Start face detection loop
          detectFace();
        } catch (error) {
          console.error("Error accessing camera:", error);
          faceStatus.textContent = "Camera access denied. Please allow camera access and refresh.";
          faceStatus.className = "face-status error";
        }
      }

      // Detect face continuously
      async function detectFace() {
        if (!modelsLoaded || !videoStream) return;
        
        try {
          const detections = await faceapi
            .detectSingleFace(videoElement, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceDescriptor();
          
          if (detections) {
            faceStatus.textContent = "✅ Face detected! Click 'Capture Face' to register.";
            faceStatus.className = "face-status success";
          } else {
            faceStatus.textContent = "No face detected. Please position your face in the frame.";
            faceStatus.className = "face-status info";
          }
        } catch (error) {
          console.error("Face detection error:", error);
        }
        
        // Continue detection
        setTimeout(detectFace, 500);
      }

      // Capture multiple face descriptors (sampled frames) for more robust registration
      captureFaceBtn.addEventListener("click", async () => {
        const SAMPLES = 5; // number of frames to capture
        const INTERVAL_MS = 400; // ms between samples

        try {
          captureFaceBtn.disabled = true;
          faceStatus.textContent = "Capturing multiple face samples... Please hold still.";
          faceStatus.className = "face-status info";

          faceDescriptors = [];

          for (let i = 0; i < SAMPLES; i++) {
            const detection = await faceapi
              .detectSingleFace(videoElement, new faceapi.TinyFaceDetectorOptions())
              .withFaceLandmarks()
              .withFaceDescriptor();

            if (detection && detection.descriptor) {
              faceDescriptors.push(Array.from(detection.descriptor));
              faceStatus.textContent = `Captured sample ${i + 1} of ${SAMPLES}`;
              faceStatus.className = "face-status info";
            } else {
              faceStatus.textContent = `No face detected for sample ${i + 1}. Retrying...`;
              faceStatus.className = "face-status error";
            }

            // wait before next sample
            if (i < SAMPLES - 1) await new Promise(r => setTimeout(r, INTERVAL_MS));
          }

          if (faceDescriptors.length === 0) {
            faceStatus.textContent = "No usable face samples captured. Please try again.";
            faceStatus.className = "face-status error";
            captureFaceBtn.disabled = false;
            return;
          }

          // Stop camera
          if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoElement.srcObject = null;
          }

          faceStatus.textContent = `✅ Captured ${faceDescriptors.length} face sample(s). You can proceed with registration.`;
          faceStatus.className = "face-status success";
          captureFaceBtn.textContent = "Face Captured ✅";
          captureFaceBtn.disabled = true;

        } catch (error) {
          console.error("Error capturing face:", error);
          faceStatus.textContent = "Error capturing face. Please try again.";
          faceStatus.className = "face-status error";
          captureFaceBtn.disabled = false;
        }
      });

      // Load models on page load
      await loadFaceModels();
      // Check election schedule and enable/disable register button
      async function applyElectionScheduleToRegister() {
        const registerBtn = document.getElementById('registerBtn');
        try {
          const res = await fetch('http://localhost:4000/api/election-window');
          if (!res.ok) { registerBtn.disabled = true; return; }
          const j = await res.json();
          if (!j.ok || !j.data) { registerBtn.disabled = true; return; }
          const start = j.data.start_time ? new Date(j.data.start_time) : null;
          const end = j.data.end_time ? new Date(j.data.end_time) : null;
          const now = new Date();
          if (start && end && now >= start && now <= end) {
            registerBtn.disabled = false;
          } else {
            registerBtn.disabled = true;
            let hint = document.getElementById('registrationWindowHint');
            if (!hint) {
              hint = document.createElement('div');
              hint.id = 'registrationWindowHint';
              hint.style.margin = '10px 0';
              hint.style.padding = '8px';
              hint.style.borderRadius = '6px';
              hint.style.background = '#fff3cd';
              hint.style.color = '#856404';
              hint.style.border = '1px solid #ffeeba';
              hint.textContent = 'Registration is currently closed.';
              registerBtn.parentNode.insertBefore(hint, registerBtn);
            }
          }
        } catch (err) {
          console.warn('Could not fetch election window', err);
          document.getElementById('registerBtn').disabled = true;
        }
      }

      applyElectionScheduleToRegister();

      // 🦊 Connect MetaMask
      connectWalletBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        if (window.ethereum) {
          try {
            const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            userWallet = accounts[0];
            walletStatus.style.display = "block";
            walletAddressEl.textContent = `Connected: ${userWallet}`;
            connectWalletBtn.textContent = "Wallet Connected ✅";
          } catch (err) {
            alert("MetaMask connection failed: " + err.message);
          }
        } else {
          alert("MetaMask not detected. Please install it.");
        }
      });

      // 📋 Handle Form Submit
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const fullName = form.fullName.value.trim();
        const dob = form.dateOfBirth.value.trim();
        const mobile = form.mobileNumber.value.trim();
        const aadhaar = form.aadhaarNumber.value.trim();
        const email = form.email.value.trim();

        if (!userWallet) {
          alert("Please connect MetaMask first.");
          return;
        }

        // Check if face is captured
        if ((!faceDescriptors || faceDescriptors.length === 0)) {
          alert("⚠️ Please capture your face first before registering.");
          return;
        }

        // Prefer multi-sample descriptors if available
        const storedDescriptor = (faceDescriptors && faceDescriptors.length > 0) ? faceDescriptors : [];

        const voterData = {
          aadhaar_no: aadhaar,
          name: fullName,
          wallet_address: userWallet,
          dob: dob,
          mobile_no: mobile,
          email: email,
          face_descriptor: storedDescriptor // Store face descriptor(s) as array of arrays
        };

        try {
          const res = await fetch("http://localhost:4000/api/registerVoter", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(voterData)
          });

          const data = await res.json();

          if (data.ok) {
            alert(`✅ ${data.message || "Registration successful!"}`);
            form.reset();
            walletStatus.style.display = "none";
            userWallet = null;
          } else {
            alert(`❌ Failed: ${data.message}`);
          }
        } catch (err) {
          alert("❌ Error: " + err.message);
        }
      });
    });
  </script>
</body>
</html>
